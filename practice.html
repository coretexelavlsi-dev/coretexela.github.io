<!-- PRACTICE CONTAINER -->
<section class="practice-container">

  <!-- PROBLEM -->
  <div class="problem-box">
    <h2 id="problemTitle">2:1 Multiplexer</h2>

    <p id="problemDesc">
      Design a 2:1 multiplexer in Verilog.
      Output y = a when sel = 0, else y = b.
    </p>
  </div>

  <!-- CODE EDITOR -->
  <div class="editor-box">
    <textarea id="codeArea">
module mux(input a,b,sel, output y);

endmodule
    </textarea>

    <button onclick="runCode()">Run</button>
    <button onclick="submitCode()">Submit</button>
  </div>

  <!-- OUTPUT -->
  <div class="output-box">
    <h3>Result</h3>
    <p id="result">Not executed yet</p>
  </div>

</section>
