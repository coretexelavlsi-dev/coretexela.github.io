<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CORETEXELA - Practice Engine</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">CORETEXELA</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="learn.html">Learn</a>
    <a href="project.html">Projects</a>
  </nav>
</header>

<!-- PRACTICE CONTAINER -->
<section class="practice-container">

  <!-- LEFT: PROBLEM LIST -->
  <aside class="problem-list">

    <h2>Problems</h2>
    <p style="opacity:0.6; font-size:12px;">
      HDL Practice Set
    </p>

    <ul id="problemList"></ul>

  </aside>

  <!-- CENTER: CODE EDITOR -->
  <main class="editor-panel">

    <div class="problem-header">

      <h1 id="problemTitle">Select a Problem</h1>

      <p id="problemDesc">
        Choose a problem to start coding
      </p>

    </div>

    <!-- CODE AREA -->
    <textarea id="codeArea" class="code-editor">
// Write Verilog code here
module top;

endmodule
    </textarea>

    <!-- ACTION BUTTONS -->
    <div class="actions">

      <button class="primary" onclick="runCode()">Run</button>
      <button class="secondary" onclick="submitCode()">Submit</button>

    </div>

  </main>

  <!-- RIGHT: OUTPUT PANEL -->
  <aside class="output-panel">

    <h3>Output Console</h3>

    <div id="outputBox">
      Waiting for execution...
    </div>

    <div class="hint-box">
      <h4>Hint</h4>
      <p id="hintText">
        Solve the problem step by step.
      </p>
    </div>

  </aside>

</section>

<script src="js/practice.js"></script>

</body>
</html>
